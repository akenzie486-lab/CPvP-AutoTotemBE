name: Build CPvP AutoTotem

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-30 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build mod
        run: |
          cmake --build build --target cpvp_autototem --parallel 2

      - name: Prepare package
        run: |
          mkdir -p package/CPvPAutoTotem
          cp manifest.json package/CPvPAutoTotem/
          cp build/out/arm64-v8a/libCPvPAutoTotem.so package/CPvPAutoTotem/

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: CPvP-AutoTotem
          path: package/CPvPAutoTotem/
          
